[package]
name = "folio_core"
version = "0.82.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
[dependencies]
sha2 = "=0.10.9"
chrono = "=0.4.45"
harper-core = { version = "=2.11.0", default-features = false, features = ["concurrent"] }
base64 = "0.23.1"
flutter_rust_bridge = "=2.13.0"
ironcalc_base = { version = "=0.8.3", path = "vendor/ironcalc_base" }
roxmltree = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "=3.2.0"
ssf-rs = { version = "=0.1.0", path = "vendor/ssf-rs" }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSError", "NSString", "NSURL"] }
[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
