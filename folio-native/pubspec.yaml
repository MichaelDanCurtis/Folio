name: folio_native
description: Native Flutter and Rust document and spreadsheet workspace.
publish_to: none
version: 0.82.0+1
environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_quill:
    path: vendor/flutter_quill
  flutter_rust_bridge: 2.13.0
  file_selector: ^1.0.3
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  intl: any
  ffi: ^2.2.0
  crypto: ^3.0.7
  dart_quill_delta: any
  a2ui_core: 0.1.1
  genui: 0.10.3
  json_schema_builder: ^0.1.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/templates/
