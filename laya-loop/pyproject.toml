[project]
name = "laya-loop"
version = "0.1.0"
description = "Two-way loop: Laya runs fast local checks, Claude reviews what Laya is unsure about and writes new checks"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "fastapi>=0.141.1",
    "laya-mlx>=0.2.0",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[project.scripts]
laya-loop = "laya_loop.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["laya_loop"]
